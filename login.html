<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login — Lourdes College SHS Department</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">LC</span>
        <span>Lourdes College<small>Faculty Portal</small></span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-ghost btn-sm">&larr; Back to website</a>
      </div>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <span class="brand-mark">LC</span>
        <h1>Teacher Login</h1>
        <p>Sign in to manage your faculty profile.</p>
      </div>

      <div id="login-msg" class="form-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" required placeholder="you@lourdescollege.edu.ph" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" id="login-submit" class="btn btn-primary" style="width:100%;">Sign In</button>
      </form>

      <div class="auth-foot">
        Not a faculty member? <a href="index.html" style="color:var(--pink-dark);font-weight:600;">Return to homepage</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
